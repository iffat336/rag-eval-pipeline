name: RAG Evaluation

on:
  pull_request:
    paths:
      - "src/**"
      - "data/docs/**"
      - "eval/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch: {}

jobs:
  ragas-eval:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
          - 6333:6333

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: http://localhost:6333
      LANGCHAIN_TRACING_V2: "true"
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_PROJECT: rag-eval-pipeline-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "Qdrant did not become ready in time" && exit 1

      - name: Index sample documents
        run: python -m src.ingestion.indexer data/docs

      - name: Run RAGAS evaluation suite
        id: eval
        run: python -m eval.run_ragas_eval

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragas-eval-report
          path: eval/results/*.json

      - name: Summarize results
        if: always()
        run: |
          REPORT=$(ls -t eval/results/*.json | head -n1)
          echo "## RAGAS Evaluation Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
